<!DOCTYPE html>
<html lang="es">
<head>
    <title>CONSULTA DE EQUIPO</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <style>
        #tabla-resultados thead th { background-color: #4364EA; color: white; }
        #spinner { display: none; }

        /* Paginación */
        .pagina-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #dee2e6;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background .15s, color .15s;
        }
        .pagina-btn:hover:not(:disabled)  { background: #e9ecef; }
        .pagina-btn.activa                { background: #4364EA; color: #fff; border-color: #4364EA; font-weight: 600; }
        .pagina-btn:disabled              { opacity: .45; cursor: not-allowed; }

        /* Badge conteo */
        #total-registros { font-size: .85rem; }

        /* Filtros card */
        #card-filtros { border-left: 4px solid #4364EA; }
    </style>
</head>
<body>
<div class="container-fluid mt-4">

    <ul class="nav nav-tabs nav-justified" id="tabsConsulta" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="tab-busqueda"
                    data-bs-toggle="tab" data-bs-target="#consulta1" type="button" role="tab">
                Búsqueda de equipo
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-resultados"
                    data-bs-toggle="tab" data-bs-target="#resultado1" type="button" role="tab" disabled>
                Resultados
            </button>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <!-- ══════════════════════════════════════════════════
             PESTAÑA 1: BÚSQUEDA CON FILTROS
        ══════════════════════════════════════════════════ -->
        <div id="consulta1" class="tab-pane fade show active" role="tabpanel">
            <div class="card p-4 shadow-sm" id="card-filtros">
                <h5 class="mb-3">Filtros de Búsqueda</h5>

                <div class="row g-3 mb-3">
                    <!-- Serie -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Núm. Serie</label>
                        <input type="text" class="form-control text-uppercase" id="f-serie"
                               placeholder="Ej: 5DC5648D"
                               oninput="this.value=this.value.toUpperCase()">
                    </div>
                    <!-- Activo -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Núm. Activo</label>
                        <input type="text" class="form-control text-uppercase" id="f-activo"
                               placeholder="Ej: 009783"
                               oninput="this.value=this.value.toUpperCase()">
                    </div>
                    <!-- Tipo de equipo -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Tipo de Equipo</label>
                        <select class="form-control" id="f-tipo">
                            <option value="">— Todos —</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Cañonera">Cañonera</option>
                            <option value="Switch">Switch</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <!-- Marca -->
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Marca</label>
                        <select class="form-control" id="f-marca">
                            <option value="">— Todas —</option>
                            <option value="HP">HP</option>
                            <option value="DELL">DELL</option>
                            <option value="LENOVO">LENOVO</option>
                            <option value="SAMSUNG">SAMSUNG</option>
                            <option value="EPSON">EPSON</option>
                            <option value="FORTINET">FORTINET</option>
                            <option value="OTROS">OTROS</option>
                        </select>
                    </div>
                </div>

                <div id="spinner" class="mb-2">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span class="ms-2 text-muted">Buscando...</span>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="button" onclick="buscarConFiltros()" class="btn btn-primary"> Buscar</button>
                    <button type="button" onclick="verTodos()"          class="btn btn-secondary"> Ver todos</button>
                    <button type="button" onclick="limpiarFiltros()"    class="btn btn-outline-secondary"> Limpiar filtros</button>
                </div>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════
             PESTAÑA 2: RESULTADOS CON PAGINACIÓN
        ══════════════════════════════════════════════════ -->
        <div id="resultado1" class="tab-pane fade" role="tabpanel">
            <div class="card p-4 shadow-sm">

                <!-- Cabecera: título + conteo + filtros activos -->
                <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                    <h5 class="mb-0">Equipos Encontrados</h5>
                    <div class="d-flex align-items-center gap-2">
                        <span id="total-registros" class="badge bg-primary"></span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="volverBusqueda()">← Volver a filtros</button>
                    </div>
                </div>

                <!-- Resumen de filtros aplicados -->
                <div id="filtros-aplicados" class="mb-3 text-muted small"></div>

                <!-- Selector de filas por página -->
                <div class="d-flex align-items-center gap-2 mb-3">
                    <label class="mb-0 text-muted small">Mostrar</label>
                    <select class="form-select form-select-sm" style="width:75px" id="filas-por-pagina"
                            onchange="cambiarFilasPorPagina()">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                    <span class="text-muted small">registros por página</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="tabla-resultados">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Núm. Serie</th>
                                <th>Núm. Activo</th>
                                <th>Estado</th>
                                <th>Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla"></tbody>
                    </table>
                </div>

                <!-- Paginación -->
                <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                    <span id="info-pagina" class="text-muted small"></span>
                    <div id="controles-paginacion" class="d-flex gap-1 flex-wrap"></div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL: VER DETALLE / EDITAR
══════════════════════════════════════════════════ -->
<div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background-color:#4364EA;">
                <h5 class="modal-title text-white">Detalle del Equipo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <!-- VISTA SOLO LECTURA -->
                <div id="vista-detalle">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="fw-bold">ID:</label><p id="d-id"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Tipo de Equipo:</label><p id="d-tipo"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Marca:</label><p id="d-marca"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Modelo:</label><p id="d-modelo"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Núm. Serie:</label><p id="d-serie"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Núm. Activo:</label><p id="d-activo"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Estado:</label><p id="d-estado"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Condición:</label><p id="d-condicion"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Fecha Compra:</label><p id="d-fecha-compra"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Fecha Asignación:</label><p id="d-fecha-asig"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Fecha Mantenimiento:</label><p id="d-fecha-mant"></p></div>
                        <div class="col-md-6"><label class="fw-bold">Usuario Ingreso:</label><p id="d-usuario"></p></div>
                        <div class="col-md-12"><label class="fw-bold">Comentario:</label><p id="d-comentario"></p></div>
                    </div>
                </div>

                <!-- VISTA EDICIÓN -->
                <div id="vista-edicion" style="display:none;">
                    <div class="row g-3">
                        <input type="hidden" id="e-id">
                        <div class="col-md-6">
                            <label class="fw-bold">Tipo de Equipo</label>
                            <select class="form-control" id="e-tipo">
                                <option value="Laptop">Laptop</option>
                                <option value="Monitor">Monitor</option>
                                <option value="Cañonera">Cañonera</option>
                                <option value="Switch">Switch</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Marca</label>
                            <input type="text" class="form-control text-uppercase" id="e-marca" oninput="this.value=this.value.toUpperCase()">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Modelo</label>
                            <input type="text" class="form-control text-uppercase" id="e-modelo" oninput="this.value=this.value.toUpperCase()">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Núm. Serie</label>
                            <input type="text" class="form-control text-uppercase" id="e-serie" oninput="this.value=this.value.toUpperCase()">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Núm. Activo</label>
                            <input type="text" class="form-control text-uppercase" id="e-activo" oninput="this.value=this.value.toUpperCase()">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Estado</label>
                            <select class="form-control" id="e-estado">
                                <option value="NUEVO">NUEVO</option>
                                <option value="USADO">USADO</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Condición</label>
                            <select class="form-control" id="e-condicion">
                                <option value="NUEVO">NUEVO</option>
                                <option value="EXCELENTE">EXCELENTE</option>
                                <option value="BUENA">BUENA</option>
                                <option value="USADO">USADO</option>
                                <option value="MALO">MALO</option>
                                <option value="OBSOLETO">OBSOLETO</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Fecha Compra</label>
                            <input type="date" class="form-control" id="e-fecha-compra">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Fecha Asignación</label>
                            <input type="date" class="form-control" id="e-fecha-asig">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Fecha Mantenimiento</label>
                            <input type="date" class="form-control" id="e-fecha-mant">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Usuario Ingreso</label>
                            <input type="text" class="form-control" id="e-usuario">
                        </div>
                        <div class="col-md-12">
                            <label class="fw-bold">Comentario</label>
                            <textarea class="form-control text-uppercase" id="e-comentario" rows="2" oninput="this.value=this.value.toUpperCase()"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTONES DEL MODAL -->
            <div class="modal-footer">
                <div id="botones-detalle" class="w-100 d-flex gap-2">
                    <button type="button" class="btn btn-outline-warning" onclick="activarEdicion()">✏️ Modificar</button>
                    <button type="button" class="btn btn-outline-danger"  onclick="eliminarEquipo()">🗑️ Eliminar</button>
                </div>
                <div id="botones-edicion" class="w-100 d-flex gap-2" style="display:none !important;">
                    <button type="button" class="btn btn-outline-success"    onclick="guardarCambios()">💾 Guardar cambios</button>
                    <button type="button" class="btn btn-outline-secondary"  onclick="cancelarEdicion()">✖ Cancelar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";
    let equipoActual   = null;
    let resultadosFull = [];   // todos los registros filtrados
    let paginaActual   = 1;
    let filasPorPagina = 10;

    // ══════════════════════════════════════════════════
    //  BÚSQUEDA CON FILTROS
    // ══════════════════════════════════════════════════
    async function buscarConFiltros() {
        const fSerie = document.getElementById("f-serie").value.trim();
        const fActivo= document.getElementById("f-activo").value.trim();
        const fTipo  = document.getElementById("f-tipo").value;
        const fMarca = document.getElementById("f-marca").value;

        // Al menos un filtro debe estar activo
        if (!fSerie && !fActivo && !fTipo && !fMarca) {
            swal("Atención", "Ingresa al menos un criterio de búsqueda.", "warning");
            return;
        }

        mostrarSpinner(true);
        try {
            const res  = await fetch(`${API_URL}/inventario`);
            const data = await res.json();

            const resultados = data.inventario.filter(e => {
                const okSerie  = !fSerie  || (e.serie  && e.serie.toUpperCase().includes(fSerie.toUpperCase()));
                const okActivo = !fActivo || (e.activo && e.activo.toUpperCase().includes(fActivo.toUpperCase()));
                const okTipo   = !fTipo   || (e.tipo_equipo && e.tipo_equipo.toUpperCase() === fTipo.toUpperCase());
                const okMarca  = !fMarca  || (e.marca && e.marca.toUpperCase() === fMarca.toUpperCase());
                return okSerie && okActivo && okTipo && okMarca;
            });

            if (resultados.length === 0) {
                swal("Sin resultados", "No se encontró ningún equipo con esos filtros.", "info");
            } else {
                mostrarResumenFiltros({ fSerie, fActivo, fTipo, fMarca });
                iniciarPaginacion(resultados);
            }
        } catch { swal("Error", "No se pudo conectar con la API.", "error"); }
        mostrarSpinner(false);
    }

    async function verTodos() {
        mostrarSpinner(true);
        try {
            const res  = await fetch(`${API_URL}/inventario`);
            const data = await res.json();
            if (data.inventario.length === 0) {
                swal("Sin registros", "No hay equipos aún.", "info");
            } else {
                document.getElementById("filtros-aplicados").innerHTML = "";
                iniciarPaginacion(data.inventario);
            }
        } catch { swal("Error", "No se pudo conectar con la API.", "error"); }
        mostrarSpinner(false);
    }

    function limpiarFiltros() {
        document.getElementById("f-serie").value  = "";
        document.getElementById("f-activo").value = "";
        document.getElementById("f-tipo").value   = "";
        document.getElementById("f-marca").value  = "";
    }

    // ══════════════════════════════════════════════════
    //  PAGINACIÓN
    // ══════════════════════════════════════════════════
    function iniciarPaginacion(datos) {
        resultadosFull = datos;
        paginaActual   = 1;
        filasPorPagina = parseInt(document.getElementById("filas-por-pagina").value);
        renderPagina();
        const btn = document.getElementById("tab-resultados");
        btn.removeAttribute("disabled");
        bootstrap.Tab.getOrCreateInstance(btn).show();
    }

    function renderPagina() {
        const total     = resultadosFull.length;
        const totalPags = Math.ceil(total / filasPorPagina);
        const inicio    = (paginaActual - 1) * filasPorPagina;
        const fin       = Math.min(inicio + filasPorPagina, total);
        const pagina    = resultadosFull.slice(inicio, fin);

        // Tabla
        const tbody = document.getElementById("cuerpo-tabla");
        tbody.innerHTML = "";
        pagina.forEach(e => {
            tbody.innerHTML += `
                <tr>
                    <td>${e.id_equipo      ?? "-"}</td>
                    <td>${e.tipo_equipo    ?? "-"}</td>
                    <td>${e.marca          ?? "-"}</td>
                    <td>${e.modelo         ?? "-"}</td>
                    <td>${e.serie          ?? "-"}</td>
                    <td>${e.activo         ?? "-"}</td>
                    <td>${e.estado         ?? "-"}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick='abrirDetalle(${JSON.stringify(e)})'>
                             Ver detalle
                        </button>
                    </td>
                </tr>`;
        });

        // Badge total
        document.getElementById("total-registros").textContent = `${total} registro(s)`;

        // Info de página
        document.getElementById("info-pagina").textContent =
            `Mostrando ${inicio + 1}–${fin} de ${total} registros`;

        // Controles de paginación
        renderControlesPaginacion(totalPags);
    }

    function renderControlesPaginacion(totalPags) {
        const cont = document.getElementById("controles-paginacion");
        cont.innerHTML = "";

        const crearBtn = (texto, pagina, deshabilitado = false, activa = false) => {
            const btn = document.createElement("button");
            btn.className   = "pagina-btn" + (activa ? " activa" : "");
            btn.textContent = texto;
            btn.disabled    = deshabilitado;
            btn.onclick     = () => { paginaActual = pagina; renderPagina(); };
            return btn;
        };

        // Anterior
        cont.appendChild(crearBtn("«", paginaActual - 1, paginaActual === 1));

        // Páginas con ventana deslizante (máx 5 botones visibles)
        const rango = 2;
        let desde = Math.max(1, paginaActual - rango);
        let hasta  = Math.min(totalPags, paginaActual + rango);

        if (desde > 1) {
            cont.appendChild(crearBtn("1", 1));
            if (desde > 2) {
                const sep = document.createElement("span");
                sep.textContent = "…";
                sep.className   = "px-1 text-muted align-self-center";
                cont.appendChild(sep);
            }
        }

        for (let p = desde; p <= hasta; p++) {
            cont.appendChild(crearBtn(p, p, false, p === paginaActual));
        }

        if (hasta < totalPags) {
            if (hasta < totalPags - 1) {
                const sep = document.createElement("span");
                sep.textContent = "…";
                sep.className   = "px-1 text-muted align-self-center";
                cont.appendChild(sep);
            }
            cont.appendChild(crearBtn(totalPags, totalPags));
        }

        // Siguiente
        cont.appendChild(crearBtn("»", paginaActual + 1, paginaActual === totalPags));
    }

    function cambiarFilasPorPagina() {
        filasPorPagina = parseInt(document.getElementById("filas-por-pagina").value);
        paginaActual   = 1;
        if (resultadosFull.length > 0) renderPagina();
    }

    // ══════════════════════════════════════════════════
    //  RESUMEN DE FILTROS APLICADOS
    // ══════════════════════════════════════════════════
    function mostrarResumenFiltros({ fSerie, fActivo, fTipo, fMarca }) {
        const partes = [];
        if (fSerie)  partes.push(`Serie: <strong>${fSerie}</strong>`);
        if (fActivo) partes.push(`Activo: <strong>${fActivo}</strong>`);
        if (fTipo)   partes.push(`Tipo: <strong>${fTipo}</strong>`);
        if (fMarca)  partes.push(`Marca: <strong>${fMarca}</strong>`);
        document.getElementById("filtros-aplicados").innerHTML =
            partes.length ? "🔍 Filtros: " + partes.join(" &nbsp;|&nbsp; ") : "";
    }

    // ══════════════════════════════════════════════════
    //  MODAL DETALLE / EDICIÓN
    // ══════════════════════════════════════════════════
    function abrirDetalle(equipo) {
        equipoActual = equipo;
        document.getElementById("d-id").textContent           = equipo.id_equipo            ?? "-";
        document.getElementById("d-tipo").textContent         = equipo.tipo_equipo           ?? "-";
        document.getElementById("d-marca").textContent        = equipo.marca                 ?? "-";
        document.getElementById("d-modelo").textContent       = equipo.modelo                ?? "-";
        document.getElementById("d-serie").textContent        = equipo.serie                 ?? "-";
        document.getElementById("d-activo").textContent       = equipo.activo                ?? "-";
        document.getElementById("d-estado").textContent       = equipo.estado                ?? "-";
        document.getElementById("d-condicion").textContent    = equipo.condicion_equipo       ?? "-";
        document.getElementById("d-fecha-compra").textContent = equipo.fecha_compra           ?? "-";
        document.getElementById("d-fecha-asig").textContent   = equipo.fecha_asig             ?? "-";
        document.getElementById("d-fecha-mant").textContent   = equipo.fecha_mantenimiento    ?? "-";
        document.getElementById("d-usuario").textContent      = equipo.usur_ingresa           ?? "-";
        document.getElementById("d-comentario").textContent   = equipo.comentario             ?? "-";

        document.getElementById("vista-detalle").style.display   = "block";
        document.getElementById("vista-edicion").style.display   = "none";
        document.getElementById("botones-detalle").style.display = "flex";
        document.getElementById("botones-edicion").style.display = "none";

        new bootstrap.Modal(document.getElementById("modalDetalle")).show();
    }

    function activarEdicion() {
        const e = equipoActual;
        document.getElementById("e-id").value            = e.id_equipo;
        document.getElementById("e-tipo").value          = e.tipo_equipo            ?? "";
        document.getElementById("e-marca").value         = e.marca                  ?? "";
        document.getElementById("e-modelo").value        = e.modelo                 ?? "";
        document.getElementById("e-serie").value         = e.serie                  ?? "";
        document.getElementById("e-activo").value        = e.activo                 ?? "";
        document.getElementById("e-estado").value        = e.estado                 ?? "";
        document.getElementById("e-condicion").value     = e.condicion_equipo        ?? "";
        document.getElementById("e-fecha-compra").value  = e.fecha_compra            ?? "";
        document.getElementById("e-fecha-asig").value    = e.fecha_asig              ?? "";
        document.getElementById("e-fecha-mant").value    = e.fecha_mantenimiento     ?? "";
        document.getElementById("e-usuario").value       = e.usur_ingresa            ?? "";
        document.getElementById("e-comentario").value    = e.comentario              ?? "";

        document.getElementById("vista-detalle").style.display   = "none";
        document.getElementById("vista-edicion").style.display   = "block";
        document.getElementById("botones-detalle").style.display = "none";
        document.getElementById("botones-edicion").style.display = "flex";
    }

    function cancelarEdicion() {
        document.getElementById("vista-detalle").style.display   = "block";
        document.getElementById("vista-edicion").style.display   = "none";
        document.getElementById("botones-detalle").style.display = "flex";
        document.getElementById("botones-edicion").style.display = "none";
    }

    async function guardarCambios() {
        const id = document.getElementById("e-id").value;
        const payload = {
            tipo_equipo:         document.getElementById("e-tipo").value,
            marca:               document.getElementById("e-marca").value,
            modelo:              document.getElementById("e-modelo").value,
            serie:               document.getElementById("e-serie").value,
            activo:              document.getElementById("e-activo").value,
            estado:              document.getElementById("e-estado").value,
            condicion_equipo:    document.getElementById("e-condicion").value,
            comentario:          document.getElementById("e-comentario").value,
            fecha_compra:        document.getElementById("e-fecha-compra").value,
            fecha_asig:          document.getElementById("e-fecha-asig").value   || null,
            fecha_mantenimiento: document.getElementById("e-fecha-mant").value   || null,
            usur_ingresa:        document.getElementById("e-usuario").value       || null,
            foto_equipo:         null
        };
        try {
            const res = await fetch(`${API_URL}/inventario/${id}`, {
                method:  "PUT",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify(payload)
            });
            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById("modalDetalle")).hide();
                swal("¡Actualizado!", "El equipo fue modificado correctamente.", "success");
                verTodos();
            } else {
                const err = await res.json();
                swal("Error", err.detail ?? "No se pudo actualizar.", "error");
            }
        } catch { swal("Error", "No se pudo conectar con la API.", "error"); }
    }

    function eliminarEquipo() {
        const id = equipoActual.id_equipo;
        swal({
            title: "¿Eliminar este equipo?",
            text:  "Esta acción no se puede deshacer.",
            icon:  "warning",
            buttons: { cancel: "Cancelar", confirm: { text: "Sí, eliminar", className: "btn-danger" } }
        }).then(async (confirm) => {
            if (!confirm) return;
            try {
                const res = await fetch(`${API_URL}/inventario/${id}`, { method: "DELETE" });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("modalDetalle")).hide();
                    swal("¡Eliminado!", "El equipo fue eliminado correctamente.", "success");
                    // Quitar de la lista local y re-renderizar sin volver a la API
                    resultadosFull = resultadosFull.filter(e => e.id_equipo !== id);
                    if (paginaActual > Math.ceil(resultadosFull.length / filasPorPagina)) {
                        paginaActual = Math.max(1, paginaActual - 1);
                    }
                    if (resultadosFull.length === 0) {
                        volverBusqueda();
                    } else {
                        renderPagina();
                    }
                } else {
                    swal("Error", "No se pudo eliminar el equipo.", "error");
                }
            } catch { swal("Error", "No se pudo conectar con la API.", "error"); }
        });
    }

    // ══════════════════════════════════════════════════
    //  UTILIDADES
    // ══════════════════════════════════════════════════
    function volverBusqueda() {
        bootstrap.Tab.getOrCreateInstance(document.getElementById("tab-busqueda")).show();
    }
    function mostrarSpinner(v) {
        document.getElementById("spinner").style.display = v ? "block" : "none";
    }

    // Enter en cualquier campo de filtro dispara la búsqueda
    ["f-serie","f-activo"].forEach(id => {
        document.getElementById(id).addEventListener("keypress", e => {
            if (e.key === "Enter") buscarConFiltros();
        });
    });
</script>
