    <style>
        .navbar { background-color: #4364EA !important; border-radius: 10px; }

        /* Indicador de validación en tiempo real */
        .campo-ok    { border-color: #198754 !important; }
        .campo-error { border-color: #dc3545 !important; }

        .feedback-campo {
            font-size: 0.82rem;
            margin-top: 4px;
            min-height: 18px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .feedback-campo.ok       { color: #198754; }
        .feedback-campo.error    { color: #dc3545; }
        .feedback-campo.checking { color: #6c757d; }

        .spinner-field {
            width: 14px; height: 14px;
            border: 2px solid #ccc;
            border-top-color: #6c757d;
            border-radius: 50%;
            display: inline-block;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-salir {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9999;
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220,53,69,0.4);
            transition: opacity .2s, transform .1s;
        }
        .btn-salir:hover  { opacity: .9; }
        .btn-salir:active { transform: scale(.97); }
    </style>
</head>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        let inventarioCache = [];

        async function cargarInventario() {
            try {
                const res  = await fetch(`${API_URL}/inventario`);
                const data = await res.json();
                inventarioCache = data.inventario || [];
            } catch {
                inventarioCache = [];
            }
        }

        cargarInventario();

        function irAConsulta() { window.location.href = "consulta.html"; }

        function cerrarSesion() {
            swal({
                title: "¿Deseas salir?",
                text:  "Se cerrará la sesión actual.",
                icon:  "warning",
                buttons: {
                    cancel:  "Cancelar",
                    confirm: { text: "Sí, salir", className: "btn-danger" }
                }
            }).then((confirm) => {
                if (confirm) window.location.href = "login.html";
            });
        }

        const timers = {};
        function debounce(key, fn, delay = 350) {
            clearTimeout(timers[key]);
            timers[key] = setTimeout(fn, delay);
        }

        function validarCampoEnVivo(input, tipo, fbId) {
            const valor = input.value.trim();
            const fb    = document.getElementById(fbId);

            if (!valor) {
                setFeedback(input, fb, '', '');
                return;
            }

            setFeedback(input, fb, 'checking', '<span class="spinner-field"></span> Verificando...');

            debounce(fbId, () => {
                const campo  = tipo === 'serie' ? 'serie' : 'activo';
                const existe = inventarioCache.some(
                    e => e[campo] && e[campo].toUpperCase() === valor.toUpperCase()
                );

                if (existe) {
                    setFeedback(input, fb, 'error', `✖ Ya existe un equipo con este ${tipo}`);
                } else {
                    setFeedback(input, fb, 'ok', '✔ Disponible');
                }
            });
        }

        function setFeedback(input, fb, estado, html) {
            fb.innerHTML = html;
            fb.className = 'feedback-campo ' + estado;
            input.classList.remove('campo-ok', 'campo-error');
            if (estado === 'ok')    input.classList.add('campo-ok');
            if (estado === 'error') input.classList.add('campo-error');
        }

        const opt = document.getElementById("tipo_equipo");
        if (opt) {
            opt.addEventListener("change", function(e) {
                const v = e.target.value;
                document.getElementById("ing_laptop").style.display  = (v === "1") ? "block" : "none";
                document.getElementById("ing_monitor").style.display = (v === "2") ? "block" : "none";
                document.getElementById("ing_canon").style.display   = (v === "3") ? "block" : "none";
                document.getElementById("ing_switch").style.display  = (v === "4") ? "block" : "none";
                document.getElementById("ing_otros").style.display   = (v === "5") ? "block" : "none";
            });
        }

        const camposPorTipo = {
            "1": {
                tipo: "Laptop",
                marca:     () => document.getElementById("marca_equipo_laptop").value,
                modelo:    () => document.getElementById("modelo_equipo_laptop").value,
                serie:     () => document.getElementById("serie_equip_laptop").value,
                activo:    () => document.getElementById("num_activo_laptop").value,
                estado:    () => document.getElementById("est_laptop").value,
                condicion: () => document.getElementById("condi_equip_laptop").value,
                comentario:() => document.getElementById("obs_equipo_lap").value,
            },
            "2": {
                tipo: "Monitor",
                marca:     () => document.getElementById("marca_equipo_mon").value,
                modelo:    () => document.getElementById("modelo_equipo_mon").value,
                serie:     () => document.getElementById("serie_equip_mon").value,
                activo:    () => document.getElementById("num_activo_mon").value,
                estado:    () => document.getElementById("est_mon").value,
                condicion: () => document.getElementById("condi_equip_mon").value,
                comentario:() => document.getElementById("obs_equipo_mon").value,
            },
            "3": {
                tipo: "Cañonera",
                marca:     () => document.getElementById("marca_equipo_cano").value,
                modelo:    () => document.getElementById("modelo_equipo_cano").value,
                serie:     () => document.getElementById("serie_equip_cano").value,
                activo:    () => document.getElementById("num_activo_cano").value,
                estado:    () => document.getElementById("est_cano").value,
                condicion: () => document.getElementById("condi_equip_cano").value,
                comentario:() => document.getElementById("obs_equipo_cano").value,
            },
            "4": {
                tipo: "Switch",
                marca:     () => document.getElementById("marca_equipo_switch").value,
                modelo:    () => document.getElementById("modelo_equipo_switch").value,
                serie:     () => document.getElementById("serie_equip_switch").value,
                activo:    () => document.getElementById("num_activo_switch").value,
                estado:    () => document.getElementById("est_switch").value,
                condicion: () => document.getElementById("condi_equip_switch").value,
                comentario:() => document.getElementById("obs_equipo_switch").value,
            },
            "5": {
                tipo: "Otros",
                marca:     () => document.getElementById("marca_equipo_otros").value,
                modelo:    () => document.getElementById("modelo_equipo_otros").value,
                serie:     () => document.getElementById("serie_equip_otros").value,
                activo:    () => document.getElementById("num_activo_otros").value,
                estado:    () => document.getElementById("est_otros").value,
                condicion: () => document.getElementById("condi_equip_otros").value,
                comentario:() => document.getElementById("obs_equipo_otros").value,
            }
        };

        function ingreso_equipo() {
            const tipo = document.getElementById("tipo_equipo").value;

            if (tipo === "0") {
                swal("Atención", "Seleccione el tipo de equipo a registrar", "warning");
                return;
            }

            const campos = camposPorTipo[tipo];

            if (!campos.marca())      { swal("Validar datos", "Seleccione la marca del equipo", "error");       return; }
            if (!campos.modelo())     { swal("Validar datos", "Ingrese el modelo del equipo", "error");         return; }
            if (!campos.serie())      { swal("Validar datos", "Ingrese el número de serie", "error");           return; }
            if (!campos.activo())     { swal("Validar datos", "Ingrese el número de activo", "error");          return; }
            if (!campos.estado())     { swal("Validar datos", "Seleccione el estado del equipo", "error");      return; }
            if (!campos.condicion())  { swal("Validar datos", "Seleccione la condición del equipo", "error");   return; }
            if (!campos.comentario()) { swal("Validar datos", "Ingrese una observación o comentario", "error"); return; }

            const serieDup  = inventarioCache.some(e => e.serie  && e.serie.toUpperCase()  === campos.serie().toUpperCase());
            const activoDup = inventarioCache.some(e => e.activo && e.activo.toUpperCase() === campos.activo().toUpperCase());

            if (serieDup) {
                swal("Serie duplicada", `Ya existe un equipo con la serie "${campos.serie()}". Corrija el número antes de continuar.`, "error");
                return;
            }
            if (activoDup) {
                swal("Activo duplicado", `Ya existe un equipo con el activo "${campos.activo()}". Corrija el número antes de continuar.`, "error");
                return;
            }

            swal({
                title: "¿Desea ingresar este equipo al sistema?",
                text:  "Asegúrese de que la información sea correcta.",
                icon:  "warning",
                buttons: {
                    cancel:  "Cancelar",
                    confirm: { text: "Sí, continuar", className: "btn-success" }
                }
            }).then((confirm) => {
                if (confirm) enviarAFastAPI(campos);
            });
        }

        async function enviarAFastAPI(campos) {
            const hoy    = new Date().toISOString().split("T")[0];
            const serie  = campos.serie();
            const activo = campos.activo();

            const payload = {
                tipo_equipo:         campos.tipo,
                marca:               campos.marca(),
                modelo:              campos.modelo(),
                serie:               serie,
                activo:              activo,
                estado:              campos.estado(),
                condicion_equipo:    campos.condicion(),
                comentario:          campos.comentario(),
                fecha_compra:        hoy,
                fecha_asig:          null,
                fecha_mantenimiento: null,
                usur_ingresa:        null,
                foto_equipo:         null
            };

            try {
                const response = await fetch(`${API_URL}/inventario`, {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    await cargarInventario();
                    swal("¡Éxito!", `Equipo registrado correctamente. ID asignado: #${data.id_equipo}`, "success");
                    limpiarFormulario();
                } else {
                    const error = await response.json();
                    swal("Error", "No se pudo registrar: " + (error.detail || "Error desconocido"), "error");
                }
            } catch {
                swal("Error de conexión", "No se pudo conectar con la API. Verifique que FastAPI esté corriendo.", "error");
            }
        }

        function limpiarFormulario() {
            document.getElementById("tipo_equipo").value = "0";
            document.querySelectorAll(".ingreso_equipo").forEach(el => el.style.display = "none");
            document.querySelectorAll("input[type='text'], textarea, select").forEach(el => {
                if (el.id !== "tipo_equipo") el.value = "";
            });
            document.querySelectorAll(".feedback-campo").forEach(fb => {
                fb.innerHTML = "";
                fb.className = "feedback-campo";
            });
            document.querySelectorAll(".campo-ok, .campo-error").forEach(el => {
                el.classList.remove("campo-ok", "campo-error");
            });
        }

        function cancelar() { limpiarFormulario(); }
    </script>
</body>
</html>
